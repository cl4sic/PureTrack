name: PureTrack CI & Automated Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag version (e.g. v1.1.9)'
        required: false
        default: 'v1.1.9'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Standalone Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Setup Windows Audio Binaries (FFmpeg & Chromaprint)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          
          # 1. Localizar binarios reales de FFmpeg y FFprobe (>10MB, evitando shims de Chocolatey)
          Write-Host "Localizando binarios completos de FFmpeg y FFprobe..."
          $realFFmpeg = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\ffmpeg" -Recurse -Filter "ffmpeg.exe" -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 10MB } | Select-Object -First 1
          $realFFprobe = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\ffmpeg" -Recurse -Filter "ffprobe.exe" -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 10MB } | Select-Object -First 1

          if (-not ($realFFmpeg -and $realFFprobe)) {
              Write-Host "Descargando FFmpeg completo desde GitHub Releases (BtbN/FFmpeg-Builds)..."
              $ffmpegZip = "$env:TEMP\ffmpeg_full.zip"
              curl.exe -sSL --retry 5 --connect-timeout 25 -o $ffmpegZip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
              $ffmpegExtract = "$env:TEMP\ffmpeg_extracted"
              New-Item -ItemType Directory -Force -Path $ffmpegExtract | Out-Null
              tar.exe -xf $ffmpegZip -C $ffmpegExtract
              $realFFmpeg = Get-ChildItem -Path $ffmpegExtract -Recurse -Filter "ffmpeg.exe" | Where-Object { $_.Length -gt 10MB } | Select-Object -First 1
              $realFFprobe = Get-ChildItem -Path $ffmpegExtract -Recurse -Filter "ffprobe.exe" | Where-Object { $_.Length -gt 10MB } | Select-Object -First 1
          }

          if (-not ($realFFmpeg -and $realFFprobe)) {
              throw "No se pudieron obtener binarios reales de FFmpeg (>10MB)."
          }

          Write-Host "Copiando FFmpeg real ($(($realFFmpeg.Length / 1MB).ToString('F1')) MB) a bin\ffmpeg.exe..."
          Copy-Item -Path $realFFmpeg.FullName -Destination "bin\ffmpeg.exe" -Force
          Write-Host "Copiando FFprobe real ($(($realFFprobe.Length / 1MB).ToString('F1')) MB) a bin\ffprobe.exe..."
          Copy-Item -Path $realFFprobe.FullName -Destination "bin\ffprobe.exe" -Force

          # 2. Descargar fpcalc (Chromaprint x64) usando curl nativo
          Write-Host "Descargando fpcalc desde AcoustID..."
          $fpcalcZip = "$env:TEMP\chromaprint.zip"
          curl.exe -sSL --retry 5 --connect-timeout 20 -o $fpcalcZip "https://github.com/acoustid/chromaprint/releases/download/v1.5.1/chromaprint-fpcalc-1.5.1-windows-x86_64.zip"
          
          $fpcalcExtract = "$env:TEMP\chromaprint_extracted"
          New-Item -ItemType Directory -Force -Path $fpcalcExtract | Out-Null
          tar.exe -xf $fpcalcZip -C $fpcalcExtract
          
          $fpcalcItem = Get-ChildItem -Path $fpcalcExtract -Recurse -Filter "fpcalc.exe" | Select-Object -First 1
          if (-not $fpcalcItem) {
              throw "No se encontró fpcalc.exe en el archivo extraído."
          }
          Write-Host "Copiando fpcalc desde: $($fpcalcItem.FullName)"
          Copy-Item -Path $fpcalcItem.FullName -Destination "bin\fpcalc.exe" -Force

          # 3. Validar existencia de todos los binarios
          Write-Host "Verificando binarios en bin\:"
          Get-ChildItem bin\
          if (-not (Test-Path "bin\ffmpeg.exe") -or -not (Test-Path "bin\ffprobe.exe") -or -not (Test-Path "bin\fpcalc.exe")) {
              throw "Error crítico: Faltan binarios obligatorios en bin\"
          }

      - name: Build PureTrack-Windows-x64.exe (Onefile)
        shell: pwsh
        run: |
          python package/build_release.py --name PureTrack-Windows-x64 --mode onefile

      - name: Package Windows ZIP Distribution (Full Suite PureTrack_Windows.zip)
        shell: pwsh
        run: |
          python package/package_windows_zip.py
          Write-Host "PureTrack_Windows.zip generado con éxito:"
          Get-Item PureTrack_Windows.zip

      - name: Upload Windows Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PureTrack-Windows-x64
          path: |
            dist/PureTrack-Windows-x64.exe
            PureTrack_Windows.zip

  build-linux:
    name: Build Standalone Linux Executable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libchromaprint-tools libsndfile1 libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Embed Linux Audio Binaries into bin/
        run: |
          mkdir -p bin
          cp $(which ffmpeg) bin/ffmpeg
          cp $(which ffprobe) bin/ffprobe
          cp $(which fpcalc) bin/fpcalc
          chmod +x bin/*
          ls -la bin/

      - name: Run Test Suite
        run: |
          QT_QPA_PLATFORM=offscreen python test_suite.py

      - name: Build PureTrack-Linux-x64 (Onefile)
        run: |
          python package/build_release.py --name PureTrack-Linux-x64 --mode onefile
          chmod +x dist/PureTrack-Linux-x64
          tar -czvf dist/PureTrack-Linux-x64.tar.gz -C dist PureTrack-Linux-x64

      - name: Upload Linux Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PureTrack-Linux-x64
          path: |
            dist/PureTrack-Linux-x64
            dist/PureTrack-Linux-x64.tar.gz

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: PureTrack-Windows-x64
          path: artifacts

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: PureTrack-Linux-x64
          path: artifacts

      - name: Display Artifacts to Publish
        run: |
          ls -la artifacts/

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/PureTrack-Windows-x64.exe
            artifacts/PureTrack_Windows.zip
            artifacts/PureTrack-Linux-x64
            artifacts/PureTrack-Linux-x64.tar.gz
          name: PureTrack ${{ steps.vars.outputs.tag }}
          tag_name: ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
