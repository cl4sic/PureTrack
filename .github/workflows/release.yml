name: PureTrack CI & Automated Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Standalone Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download Windows Audio Binaries (FFmpeg & Chromaprint)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin
          
          # Descargar FFmpeg essentials
          $ffmpegZip = "$env:TEMP\ffmpeg.zip"
          Write-Host "Descargando FFmpeg de Gyan.dev..."
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $ffmpegZip
          Expand-Archive -Path $ffmpegZip -DestinationPath "$env:TEMP\ffmpeg_ext" -Force
          $ffmpegBin = (Get-ChildItem -Path "$env:TEMP\ffmpeg_ext" -Recurse -Filter "ffmpeg.exe").FullName
          $ffprobeBin = (Get-ChildItem -Path "$env:TEMP\ffmpeg_ext" -Recurse -Filter "ffprobe.exe").FullName
          Copy-Item $ffmpegBin -Destination "bin\ffmpeg.exe"
          Copy-Item $ffprobeBin -Destination "bin\ffprobe.exe"

          # Descargar fpcalc (Chromaprint x64)
          $fpcalcZip = "$env:TEMP\chromaprint.zip"
          Write-Host "Descargando fpcalc de AcoustID..."
          Invoke-WebRequest -Uri "https://github.com/acoustid/chromaprint/releases/download/v1.5.1/chromaprint-fpcalc-1.5.1-windows-x86_64.zip" -OutFile $fpcalcZip
          Expand-Archive -Path $fpcalcZip -DestinationPath "$env:TEMP\fpcalc_ext" -Force
          $fpcalcBin = (Get-ChildItem -Path "$env:TEMP\fpcalc_ext" -Recurse -Filter "fpcalc.exe").FullName
          Copy-Item $fpcalcBin -Destination "bin\fpcalc.exe"

          Write-Host "Binarios verificados en bin\:"
          Get-ChildItem bin\

      - name: Generate High-Resolution Transparent Icon
        shell: pwsh
        run: |
          python scripts/generate_icon.py

      - name: Build PureTrack-Windows-x64.exe (Onefile)
        shell: pwsh
        run: |
          python package/build_release.py --name PureTrack-Windows-x64 --mode onefile

      - name: Upload Windows Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PureTrack-Windows-x64
          path: dist/PureTrack-Windows-x64.exe

  build-linux:
    name: Build Standalone Linux Executable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libchromaprint-tools libsndfile1 libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Embed Linux Audio Binaries into bin/
        run: |
          mkdir -p bin
          cp $(which ffmpeg) bin/ffmpeg
          cp $(which ffprobe) bin/ffprobe
          cp $(which fpcalc) bin/fpcalc
          chmod +x bin/*
          ls -la bin/

      - name: Generate High-Resolution Transparent Icon
        run: |
          QT_QPA_PLATFORM=offscreen python scripts/generate_icon.py

      - name: Run Test Suite
        run: |
          QT_QPA_PLATFORM=offscreen python test_suite.py

      - name: Build PureTrack-Linux-x64 (Onefile)
        run: |
          python package/build_release.py --name PureTrack-Linux-x64 --mode onefile
          chmod +x dist/PureTrack-Linux-x64

      - name: Upload Linux Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PureTrack-Linux-x64
          path: dist/PureTrack-Linux-x64

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: PureTrack-Windows-x64
          path: artifacts

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: PureTrack-Linux-x64
          path: artifacts

      - name: Display Artifacts to Publish
        run: |
          ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/PureTrack-Windows-x64.exe
            artifacts/PureTrack-Linux-x64
          name: PureTrack ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          generate_release_notes: true
          draft: false
          prerelease: false
